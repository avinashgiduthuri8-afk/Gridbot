name: CI

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Optional dependency (only required when GDRIVE_BACKUP_ENABLED=true),
          # installed here too so storage/drive_backup.py's import is exercised
          # by the test suite rather than silently skipped.
          pip install google-auth==2.35.0

      # Fast first gate: catches syntax errors in seconds, before spending
      # time on the full test suite below.
      - name: Compile-check every module
        run: |
          python -m compileall -q . -x '(\.venv|venv)/'

      - name: Run test suite
        run: |
          pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dca-gridbot:ci .
