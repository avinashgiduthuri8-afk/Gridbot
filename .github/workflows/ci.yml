name: CI

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r grid-trading-bot/requirements.txt
          pip install google-auth==2.35.0
          pip install aiohttp==3.11.11

      - name: Compile-check every module
        run: |
          python -m compileall -q grid-trading-bot/ -x '(\.venv|venv)/'

      - name: Check git diff
        run: |
          git diff --check

      - name: Run test suite
        run: |
          pytest grid-trading-bot/tests -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dca-gridbot:ci -f grid-trading-bot/Dockerfile grid-trading-bot/
