[pytest]
asyncio_mode = auto
testpaths = tests
# Safety net, not a substitute for finding the root cause of a hang: caps
# any single test at 30s (typical run is a full 716-test suite in ~15s) so
# a future deadlock (e.g. the asyncio.Lock re-entrancy bug fixed in
# trading/dca_manager.py) surfaces as one failing test with a stack dump
# instead of silently blocking the entire suite forever with no signal.
timeout = 30
